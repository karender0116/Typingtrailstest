name: Lesson 1 Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out test site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate preview files
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'Typing Trails' index.html
          grep -q 'Lesson 1' index.html
          grep -q 'Lesson 2' index.html
          grep -q 'startLesson1' index.html
          grep -q 'startLesson2' index.html
          grep -q 'nextLetter' index.html
          grep -q 'finishLesson2' index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
